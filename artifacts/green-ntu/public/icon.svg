<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <rect width="100" height="100" rx="22" fill="#16a34a"/>
  <!-- Globe circle -->
  <circle cx="50" cy="56" r="26" fill="none" stroke="white" stroke-width="3"/>
  <!-- Globe latitude lines -->
  <ellipse cx="50" cy="56" rx="12" ry="26" fill="none" stroke="white" stroke-width="2" opacity="0.7"/>
  <!-- Globe horizontal lines -->
  <line x1="24" y1="48" x2="76" y2="48" stroke="white" stroke-width="2" opacity="0.7"/>
  <line x1="24" y1="64" x2="76" y2="64" stroke="white" stroke-width="2" opacity="0.7"/>
  <!-- Graduation cap board -->
  <rect x="28" y="27" width="44" height="7" rx="2" fill="white"/>
  <!-- Cap top -->
  <polygon points="50,16 72,27 28,27" fill="white"/>
  <!-- Cap tassel -->
  <line x1="72" y1="27" x2="72" y2="36" stroke="white" stroke-width="2.5"/>
  <circle cx="72" cy="37" r="2.5" fill="white"/>
</svg>
