kind = "web"
previewPath = "/"
title = "الجامعة الخضراء | Green NTU"
version = "1.0.0"
id = "artifacts/green-ntu"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19006

[services.development]
run = "pnpm --filter @workspace/green-ntu run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/green-ntu", "run", "build" ]
publicDir = "artifacts/green-ntu/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19006"
BASE_PATH = "/"
